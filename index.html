<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca técnica</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="icon" href="logo_gh.png">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --accent:#4a7a1e; --brand:#8dc63f; --on-accent:#fff;
  --label:#2b2f26; --label-2:#5b6058; --label-3:#8d9287;
  --bg:#f5f6f2; --surface:#fff; --surface-2:#fbfbf8; --fill:#eef0ea; --fill-2:#e4e7df; --separator:#dfe3da;
  --rojo:#b3261e; --rojo-bg:#f9e0de; --amarillo:#8a6508; --amarillo-bg:#fbf1d6; --verde:#3f8a20; --verde-bg:#eaf4e2;
  --azul:#1d5fa8; --azul-bg:#e3eefb;
  --r-sm:10px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --shadow-card:0 1px 2px rgba(43,47,38,.06),0 6px 18px rgba(43,47,38,.07);
  --shadow-pop:0 12px 48px rgba(30,34,26,.22);
  --glass:rgba(250,251,247,.72); --ease:cubic-bezier(.32,.72,0,1);
  /* organismos */
  --o-niosh:#1d5fa8; --o-osha:#c2560b; --o-epa:#0f7a6c; --o-astm:#6b3fa0; --o-iram:#0b7fb3; --o-iso:#3949ab;
  --o-srt:#b3261e; --o-leg:#7a5c3a; --o-gh:#4a7a1e; --o-chile:#a83a6b; --o-insst:#8a6508; --o-gri:#00796b; --o-nfpa:#c62828; --o-otros:#6b7066;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#8dc63f; --on-accent:#14170f;
  --label:#eef0e8; --label-2:#a7ad9d; --label-3:#7d8377;
  --bg:#121510; --surface:#1b2019; --surface-2:#1f251c; --fill:#252b21; --fill-2:#2f362a; --separator:#2f362a;
  --rojo:#ff8a80; --rojo-bg:#2b1513; --amarillo:#e0b64a; --amarillo-bg:#2b230f; --verde:#8dc63f; --verde-bg:#1d2b16;
  --azul:#7fb2f0; --azul-bg:#14233a;
  --shadow-card:0 1px 2px rgba(0,0,0,.32),0 6px 18px rgba(0,0,0,.34); --glass:rgba(27,32,25,.7);
  --o-niosh:#7fb2f0; --o-osha:#f0a060; --o-epa:#5cc8b6; --o-astm:#b996e6; --o-iram:#6cc4ec; --o-iso:#9aa5f0;
  --o-srt:#ff8a80; --o-leg:#d2b48c; --o-gh:#8dc63f; --o-chile:#f08cb8; --o-insst:#e0b64a; --o-gri:#5cc8b6; --o-nfpa:#ff8a80; --o-otros:#a7ad9d;
}}

/* ---------- inicio de sesión (versión web) */
#app{display:none}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border-radius:20px;padding:40px 36px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-pop)}
.login-logo{display:block;height:64px;margin:0 auto 18px}
#loginScreen h1{font-size:22px;line-height:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.35px}
#loginScreen p{font-size:15px;line-height:20px;color:var(--label-2);margin:0 0 24px}
#gsiButton{display:flex;justify-content:center}
#loginSpinner{display:none;margin-top:18px}
.loading-track{position:relative;width:220px;height:4px;margin:0 auto;border-radius:999px;background:var(--fill-2);overflow:hidden}
.loading-glow{position:absolute;top:0;left:0;height:100%;width:36%;border-radius:999px;background:linear-gradient(90deg,transparent,var(--accent) 50%,transparent);animation:barrido 1.5s ease-in-out infinite}
@keyframes barrido{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}
@media (prefers-reduced-motion:reduce){.loading-glow{animation:none;width:100%;opacity:.5}}
.loading-msg{margin-top:12px;font-size:13px;line-height:18px;color:var(--label-2);transition:opacity .3s var(--ease);min-height:18px}
#loginError{display:none;font-size:15px;line-height:20px;color:var(--rojo);font-weight:600;margin-top:14px;background:var(--rojo-bg);border-radius:10px;padding:12px 14px}
#loginError button{display:block;margin:10px auto 0;border:none;cursor:pointer;background:var(--rojo);color:var(--surface);font-size:14px;font-weight:600;border-radius:999px;padding:8px 18px}
#loginError .rastro{font-size:12px;font-weight:400;opacity:.8;margin-top:6px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:15px/21px var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header */
header{position:sticky;top:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--separator)}
.bar{max-width:1480px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.marca img{height:30px}
.marca h1{font-size:17px;line-height:22px;font-weight:650;margin:0;letter-spacing:-.01em}
.marca small{display:block;font-size:12px;line-height:16px;color:var(--label-2);font-weight:400;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--fill);padding:3px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--label-2);font-weight:550;font-size:14px;padding:6px 14px;border-radius:9px;cursor:pointer;transition:background .25s var(--ease),color .25s var(--ease);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button:hover{color:var(--label)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .num{font-size:11px;line-height:16px;padding:0 6px;border-radius:8px;background:var(--rojo-bg);color:var(--rojo);font-weight:650}
.buscador{flex:1;min-width:0;max-width:520px;margin-left:auto;position:relative}
.buscador input{width:100%;font:15px/20px var(--font);color:var(--label);background:var(--fill);border:1.5px solid transparent;border-radius:11px;padding:8px 64px 8px 36px;outline:none;transition:border-color .2s,background .2s}
.buscador input:focus{border-color:var(--accent);background:var(--surface)}
.buscador svg{position:absolute;left:11px;top:10px;width:17px;height:17px;color:var(--label-3)}
.buscador kbd{position:absolute;right:9px;top:8px;font:500 11px/18px var(--font);color:var(--label-3);background:var(--surface);border:.5px solid var(--separator);border-radius:6px;padding:0 6px}
.icobtn{border:0;background:var(--fill);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--label-2);flex:none}
.icobtn:hover{color:var(--label);background:var(--fill-2)}
.icobtn.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

main{max-width:1480px;margin:0 auto;padding:22px 24px 60px}
.vista{display:none}
.vista.activa{display:block;animation:entra .35s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- hero */
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:14px 16px;min-width:0;cursor:default}
.kpi b{display:block;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--label-2)}
.kpi.clic{cursor:pointer;transition:transform .2s var(--ease)}
.kpi.clic:hover{transform:translateY(-2px)}
.kpi.alerta b{color:var(--rojo)}

/* ---------- biblioteca */
.lib{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
aside.filtros{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.fgrupo{margin-bottom:18px}
.fgrupo h3{font-size:12px;line-height:16px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--label-3);margin:0 0 6px 8px}
.fitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:9px;padding:6px 8px;cursor:pointer;text-align:left;font-size:14px;line-height:18px;color:var(--label)}
.fitem:hover{background:var(--fill)}
.fitem[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fitem[aria-pressed="true"] .c{color:inherit;opacity:.8}
.fitem .c{margin-left:auto;font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums}
.fitem .pt{width:9px;height:9px;border-radius:50%;flex:none}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 8px;cursor:pointer;color:var(--label-2)}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:var(--fill-2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .info{font-size:14px;color:var(--label-2)}
.toolbar .info b{color:var(--label)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-left:auto}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:8px;cursor:pointer;color:var(--label-2);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.1)}
select.orden{font:14px var(--font);color:var(--label);background:var(--fill);border:0;border-radius:10px;padding:7px 10px}
.activos{display:flex;gap:6px;flex-wrap:wrap}
.activos button{border:0;background:var(--verde-bg);color:var(--verde);border-radius:999px;padding:3px 10px 3px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s var(--ease);position:relative;border:0;padding:0;text-align:left}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(43,47,38,.08),0 14px 32px rgba(43,47,38,.12)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{height:150px;background:var(--fill);position:relative;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .5s var(--ease)}
.card:hover .thumb img{transform:scale(1.03)}
.thumb .ext{font:700 13px/1 var(--font);letter-spacing:.06em;color:var(--label-3);background:var(--surface);padding:10px 12px;border-radius:10px}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,rgba(0,0,0,.05))}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;z-index:1}
.cod{font:650 12px/16px var(--font);padding:3px 8px;border-radius:7px;color:#fff;background:var(--o-otros);box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap}
.extb{margin-left:auto;font:650 10px/14px var(--font);letter-spacing:.05em;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.92);color:#333}
.alertdot{position:absolute;right:10px;bottom:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;z-index:1;font-weight:700;font-size:13px}
.alertdot.mal{background:var(--rojo);color:#fff}
.alertdot.ojo{background:#e0a21a;color:#fff}
.cuerpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cuerpo h4{margin:0;font-size:15px;line-height:20px;font-weight:620;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;line-height:16px;color:var(--label-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.chip{font-size:11.5px;line-height:16px;padding:1px 8px;border-radius:999px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.chip.nueva{background:var(--verde-bg);color:var(--verde);font-weight:600}
.chip.vieja{background:var(--amarillo-bg);color:var(--amarillo);font-weight:600}
.frag{font-size:12.5px;line-height:17px;color:var(--label-2);background:var(--fill);border-radius:8px;padding:6px 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#f8e27a;color:#2b2f26;border-radius:3px;padding:0 1px}
.reempl{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(138,101,8,.06) 10px 20px);pointer-events:none}

.lista{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.fila{display:grid;grid-template-columns:130px 1fr 170px 130px 24px;gap:14px;align-items:center;padding:10px 16px;border-bottom:.5px solid var(--separator);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.fila:hover{background:var(--fill)}
.fila:last-child{border-bottom:0}
.fila .t{font-weight:560;min-width:0}
.fila .t small{display:block;font-weight:400;color:var(--label-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .cod{justify-self:start}
.vacio{padding:60px 20px;text-align:center;color:var(--label-2)}
.vacio b{display:block;font-size:17px;color:var(--label);margin-bottom:4px}

/* ---------- panel de detalle */
.velo{position:fixed;inset:0;background:rgba(20,23,18,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.velo.abierto{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(1100px,94vw);background:var(--bg);z-index:41;box-shadow:var(--shadow-pop);transform:translateX(102%);transition:transform .45s var(--ease);display:flex;flex-direction:column}
.panel.abierto{transform:none}
.phead{padding:18px 22px 14px;background:var(--surface);border-bottom:.5px solid var(--separator)}
.phead .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.phead h2{margin:0;font-size:21px;line-height:27px;font-weight:680;letter-spacing:-.01em}
.phead .sub{font-size:13px;color:var(--label-2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cerrar{margin-left:auto}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--fill);color:var(--label);transition:transform .15s var(--ease),background .2s}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn.primario{background:var(--accent);color:var(--on-accent)}
.btn.chico{padding:5px 10px;font-size:13px;border-radius:8px}
.pbody{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
.visor{background:var(--fill-2);position:relative;min-height:0}
.visor iframe,.visor video,.visor img.full{width:100%;height:100%;border:0;display:block;background:#fff}
.visor img.full{object-fit:contain;background:var(--fill-2)}
.visor .noview.cargando{background:var(--fill-2)}
.visor .noview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:var(--label-2)}
.visor .noview img{max-width:70%;max-height:60%;border-radius:10px;box-shadow:var(--shadow-card);background:#fff}
.lateral{overflow:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px;border-left:.5px solid var(--separator)}
.bloque{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:14px}
.bloque h5{margin:0 0 10px;font-size:12px;line-height:16px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--label-3)}
.aviso{display:flex;gap:9px;padding:10px 12px;border-radius:var(--r-sm);font-size:13px;line-height:18px}
.aviso.mal{background:var(--rojo-bg);color:var(--rojo)}
.aviso.ojo{background:var(--amarillo-bg);color:var(--amarillo)}
.aviso.info{background:var(--azul-bg);color:var(--azul)}
.aviso.bien{background:var(--verde-bg);color:var(--verde)}
.aviso svg{margin-top:1px}
.ver{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:.5px solid var(--separator)}
.ver:last-child{border-bottom:0}
.ver .ico{width:34px;height:42px;border-radius:5px;background:var(--fill);display:grid;place-items:center;font:700 9px var(--font);color:var(--label-3);flex:none;overflow:hidden}
.ver .ico img{width:100%;height:100%;object-fit:cover;object-position:top}
.ver .d{flex:1;min-width:0;font-size:13px;line-height:17px}
.ver .d b{font-weight:600;display:block;word-break:break-word}
.ver .d small{color:var(--label-3);display:block;margin-top:2px;word-break:break-word}
.ver .d .rutas{margin-top:4px;font-size:11.5px;color:var(--label-3)}
.ver .d .rutas div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver .lnk{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12.5px;font-weight:600;padding:2px 0}
.dato{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:13px;line-height:18px;padding:5px 0;border-bottom:.5px solid var(--separator)}
.dato:last-child{border-bottom:0}
.dato span{color:var(--label-3)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:0;cursor:pointer;font-size:12.5px;line-height:17px;padding:4px 9px;border-radius:8px;background:var(--fill);color:var(--label);display:flex;gap:6px;align-items:center;text-align:left}
.rel button:hover{background:var(--fill-2)}
.rel button i{font-style:normal;width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- planificador */
.plan{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.selector{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:14px}
.selector input[type=search]{width:100%;font:15px var(--font);background:var(--fill);border:1.5px solid transparent;border-radius:10px;padding:8px 12px;outline:none;color:var(--label);margin-bottom:10px}
.selector input[type=search]:focus{border-color:var(--accent);background:var(--surface)}
.selector h3{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--label-3);margin:12px 4px 4px}
.pchk{display:flex;align-items:flex-start;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:14px;line-height:18px}
.pchk:hover{background:var(--fill)}
.pchk input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.hoja{display:flex;flex-direction:column;gap:14px}
.hoja-head{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hoja-head h2{margin:0;font-size:20px;font-weight:680;flex:1;min-width:200px}
.hoja-head label{font-size:13px;color:var(--label-2);display:flex;align-items:center;gap:8px}
.hoja-head input{width:110px;font:15px var(--font);color:var(--label);background:var(--fill);border:1.5px solid transparent;border-radius:9px;padding:6px 10px;outline:none}
.hoja-head input:focus{border-color:var(--accent);background:var(--surface)}
.pcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px 18px;break-inside:avoid}
.pcard .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.pcard .h h3{margin:0;font-size:17px;font-weight:650}
.pcard .h .g{font-size:12px;color:var(--label-3)}
.pgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.calc{background:var(--fill);border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:19px}
.calc .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.calc .r b{font-variant-numeric:tabular-nums}
.calc input{width:80px;font:600 14px var(--font);border:1.5px solid transparent;background:var(--surface);color:var(--label);border-radius:7px;padding:3px 7px;outline:none;text-align:right}
.calc input:focus{border-color:var(--accent)}
.estado{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.estado.vigente{background:var(--verde-bg);color:var(--verde)}
.estado.por{background:var(--amarillo-bg);color:var(--amarillo)}
.estado.vencida{background:var(--rojo-bg);color:var(--rojo)}
.estado.revisar{background:var(--azul-bg);color:var(--azul)}
.estado.sin{background:var(--fill);color:var(--label-3)}
.eq{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:.5px solid var(--separator);font-size:13px}
.eq:last-child{border-bottom:0}
.eq small{display:block;color:var(--label-3);font-size:11.5px}
.check{columns:2;column-gap:24px}
.check label{display:flex;gap:8px;align-items:flex-start;break-inside:avoid;padding:5px 0;font-size:14px}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:2px 0 0}

/* ---------- matriz */
.mwrap{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:auto}
table.m{border-collapse:collapse;width:100%;font-size:13px;line-height:18px}
table.m th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--label-3);font-weight:650;padding:10px 12px;border-bottom:.5px solid var(--separator);z-index:1}
table.m td{padding:9px 12px;border-bottom:.5px solid var(--separator);vertical-align:top}
table.m tr.grp td{background:var(--fill);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--label-2);padding:6px 12px}
table.m td.p{font-weight:600;min-width:200px}
.mc{display:flex;flex-wrap:wrap;gap:4px}
.mc button{border:0;cursor:pointer;font-size:12px;line-height:16px;padding:2px 7px;border-radius:6px;color:#fff;font-weight:600}
.mc .falta{font-size:12px;color:var(--rojo);background:var(--rojo-bg);padding:2px 7px;border-radius:6px;font-weight:600}
.mc .na{color:var(--label-3)}
.cobertura{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.barra{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- observaciones */
.obs{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.obs .bloque{padding:16px 18px}
.obs h5{display:flex;align-items:center;gap:8px}
.oitem{display:flex;gap:10px;padding:9px 0;border-bottom:.5px solid var(--separator);cursor:pointer;font-size:13.5px;line-height:19px}
.oitem:last-child{border-bottom:0}
.oitem:hover .ot{text-decoration:underline}
.oitem .ot{font-weight:600}
.oitem small{display:block;color:var(--label-2)}
.linaje{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;padding:7px 0;border-bottom:.5px solid var(--separator)}
.linaje:last-child{border-bottom:0}
.linaje .flecha{color:var(--label-3)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--label);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .35s var(--ease);z-index:60;pointer-events:none}
.toast.ver{opacity:1;transform:translateX(-50%)}

@media (max-width:1240px){
  .bar{flex-wrap:wrap;row-gap:8px}
  .buscador{order:3;max-width:none;flex:1 1 100%}
  #reindex{order:2;margin-left:auto}
}
@media (max-width:1100px){
  .hero{grid-template-columns:repeat(3,1fr)}
  .pbody{grid-template-columns:1fr;grid-template-rows:55vh auto}
  .lateral{border-left:0}
  .obs{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .bar{flex-wrap:wrap;padding:10px 16px}
  .buscador{order:3;max-width:none;flex-basis:100%}
  main{padding:16px 16px 50px}
  .lib,.plan{grid-template-columns:1fr}
  aside.filtros,.selector{position:static;max-height:none}
  .hero{grid-template-columns:repeat(2,1fr)}
  .fila{grid-template-columns:1fr;gap:4px}
  .cobertura{grid-template-columns:repeat(2,1fr)}
  .check{columns:1}
}
@media print{
  header,.selector,.noprint,aside{display:none!important}
  body{background:#fff}
  main{padding:0}
  .plan{display:block}
  .pcard,.hoja-head{box-shadow:none;border:1px solid #ccc}
  .vista{display:none!important}
  #v-plan{display:block!important}
}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <img class="login-logo" src="logo_gh.png" alt="GH Consultora">
    <h1>Biblioteca técnica</h1>
    <p>GH Consultora · Normas, métodos y procedimientos<br>Iniciá sesión con una cuenta de Google autorizada.</p>
    <div id="gsiButton"></div>
    <div id="loginSpinner"><div class="loading-track"><div class="loading-glow"></div></div><div id="loadingMsg" class="loading-msg">Verificando tu acceso…</div></div>
    <div id="loginError"></div>
  </div>
</div>
<div id="app">
<header>
  <div class="bar">
    <div class="marca">
      <img src="logo_gh.png" alt="GH Consultora">
      <div><h1>Biblioteca técnica</h1><small id="sub">Cargando…</small></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="lib" aria-selected="true">Biblioteca</button>
      <button role="tab" data-v="plan">Planificador</button>
      <button role="tab" data-v="matriz">Matriz</button>
      <button role="tab" data-v="obs">Observaciones <span class="num" id="numobs"></span></button>
    </nav>
    <div class="buscador">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por título, código o resumen…" autocomplete="off">
      <kbd>⌘K</kbd>
    </div>
  </div>
</header>

<main>
  <section class="vista activa" id="v-lib">
    <div class="hero" id="hero"></div>
    <div class="lib">
      <aside class="filtros" id="filtros"></aside>
      <div>
        <div class="toolbar">
          <div class="info" id="info"></div>
          <div class="activos" id="activos"></div>
          <select class="orden" id="orden">
            <option value="rel">Relevancia</option>
            <option value="area">Por área</option>
            <option value="cod">Por código</option>
            <option value="nuevo">Más nuevos primero</option>
          </select>
          <div class="seg" style="margin-left:0">
            <button id="vgrid" aria-pressed="true" title="Mosaico"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
            <button id="vlista" aria-pressed="false" title="Lista"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
          </div>
        </div>
        <div id="resultados"></div>
      </div>
    </div>
  </section>

  <section class="vista" id="v-plan">
    <div class="plan">
      <div class="selector" id="selector"></div>
      <div class="hoja" id="hoja"></div>
    </div>
  </section>

  <section class="vista" id="v-matriz"></section>
  <section class="vista" id="v-obs"></section>
</main>

<div class="velo" id="velo"></div>
<aside class="panel" id="panel" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

</div>
<script src="plan.js?v=2026-10-16T14:55"></script>
<script src="app.js?v=2026-10-16T14:55"></script>
</body>
</html>
